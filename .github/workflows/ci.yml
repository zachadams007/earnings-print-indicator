# Added for the public copy.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e "scalping[test]"
      - run: python -m pytest tests
        working-directory: scalping
      - run: python -m compileall -q tools backtest
      - run: python tools/check.py pine/earnings_print_detector.pine
