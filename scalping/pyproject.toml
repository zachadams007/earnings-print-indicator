# Written for the public copy so the package installs and its tests run on their own.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalping-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pydantic>=2", "scikit-learn", "tzdata"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
